language = "C"
cpp_compat = true
usize_is_size_t = true
include_guard = "EMACS_RUST_DYNLIB_H"
header = "/* Generated by cbindgen.  Do not edit manually. */"

[export]
# Export only the public FFI used by C
item_types = ["functions", "globals", "typedefs"]
exclude = [
    "dynlib_open",
    "dynlib_open_for_eln",
    "dynlib_close",
    "dynlib_error",
    "dynlib_sym",
    "dynlib_func",
    "dynlib_addr",
]

[parse]
parse_deps = false
