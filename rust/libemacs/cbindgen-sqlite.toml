language = "C"
cpp_compat = true
usize_is_size_t = true
include_guard = "EMACS_RUST_SQLITE_H"
header = "/* Generated by cbindgen.  Do not edit manually. */"

[export]
item_types = ["functions", "typedefs", "globals", "structs", "enums"]
exclude = [
    "libemacs::emacs_rust_dynlib_probe",
    "libemacs::emacs_rust_dynlib_open",
    "libemacs::emacs_rust_dynlib_open_for_eln",
    "libemacs::emacs_rust_dynlib_close",
    "libemacs::emacs_rust_dynlib_error",
    "libemacs::emacs_rust_dynlib_sym",
    "libemacs::emacs_rust_dynlib_func",
    "libemacs::emacs_rust_dynlib_addr",
]

[parse]
parse_deps = false
